/small><h2>${money(pay)}</h2><div class="hero-bottom"><div><small>Выработка</small><b>${fmt(sum)} м²</b></div><div><small>Среднее за рабочий день</small><b>${money(activeDays?pay/activeDays:0)}</b></div></div></div><div class="metrics analytics-metrics">${metric('Записей',a.length,'list')}${metric('Почасовая работа',fmt(hours)+' ч','clock')}</div><div class="card analytics-card"><div class="chart-head"><div><h2>Динамика заработка</h2><p>${label}${span>30?' · интервалы':''}</p></div><strong>${money(pay)}</strong></div><svg class="analytics-chart" viewBox="0 0 320 150" role="img" aria-label="График начислений"><defs><linearGradient id="kdTrend" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff3545" stop-opacity=".38"/><stop offset="100%" stop-color="#ff3545" stop-opacity="0"/></linearGradient></defs>${[20,52,84,116].map(y=>`<line class="guide" x1="12" x2="308" y1="${y}" y2="${y}"/>`).join('')}${fill?`<polygon points="${fill}" fill="url(#kdTrend)"/>`:''}<polyline class="trend" points="${line}"/>${pts.map((p,i)=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="${count>12?2:3}"><title>${bins[i].from}${bins[i].from!==bins[i].to?' — '+bins[i].to:''}: ${money(vals[i])}</title></circle>`).join('')}${labels.map(i=>`<text x="${pts[i][0]}" y="140" text-anchor="${count===1?'middle':i===0?'start':i===count-1?'end':'middle'}">${bins[i].from.slice(5).split('-').reverse().join('.')}</text>`).join('')}</svg><div class="chart-summary"><span>Дней с записями: <b>${activeDays}</b></span><span>Макс. ${span>30?'интервал':'день'}: <b>${money(top)}</b></span></div>${a.length?'':'<div class="analytics-empty">Нет записей за выбранный период.</div>'}</div><div class="card analytics-card"><h2>Выработка по участкам</h2><p>Распределение площади обработки</p><div class="analytics-ring" style="background:${sum?'conic-gradient('+stops.join(',')+')':'var(--line)'}"><div class="analytics-ring-inner"><strong>${fmt(sum)}</strong><small>м² всего</small></div></div>${DS.map((d,i)=>`<div class="dept-line"><span class="swatch" style="background:${colors[i]}"></span><div><b>${esc(d.title)}</b><small>${money(earn[i])}</small><div class="dept-progress"><i style="background:${colors[i]};width:${sum?areas[i]/sum*100:0}%"></i></div></div><div class="dept-amount"><b>${fmt(areas[i])} м²</b><small>${sum?fmt(areas[i]/sum*100):0}%</small></div></div>`).join('')}</div><p class="analysis-note">Данные всех сотрудников на этом устройстве.</p>`}
function download(n,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download('kraski-doski-2-'+today()+'.json',JSON.stringify({format:'kraski-doski-full-v2',catalog:state.catalog,apps:state.apps},null,2),'application/json')}function csv(){let cols=['department','date','worker','order','position','operation','profile','size','qty','bad','area','hours','rate','pay'];download('report.csv','\ufeff'+[cols.join(';'),...rows().map(r=>cols.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(';'))].join('\r\n'),'text/csv')}
function setDesignTheme(t){state.theme=t;document.body.classList.toggle('light',t==='light');persist();settings()}
function settings(){$('screen').innerHTML=`<div class="settings-intro"><div class="eyebrow">УПРАВЛЕНИЕ ПРИЛОЖЕНИЕМ</div><h1>Профиль и настройки</h1><p>Сотрудники, тарифы и данные.</p></div><section class="settings-section"><h2>Внешний вид</h2><div class="card settings-panel"><div class="theme-picker">${[['dark','moon','Тёмная'],['light','sun','Светлая']].map(([t,k,n])=>`<button class="theme-option ${(state.theme==='light'?'light':'dark')===t?'active':''}" onclick="setDesignTheme('${t}')">${ico(k)}${n}${(state.theme==='light'?'light':'dark')===t?ico('check'):''}</button>`).join('')}</div></div></section><section class="settings-section"><h2>Документы</h2><div class="settings-actions"><button class="settings-action" onclick="go('orders')">${ico('box')}История заказов</button><button class="settings-action" onclick="go('report')">${ico('list')}Отчёты и печать</button></div></section><section class="settings-section"><h2>Сотрудники · ${state.catalog.workers.filter(w=>w.active!==false).length} активных</h2><div class="card settings-panel">${state.catalog.workers.map(w=>`<div class="worker-row ${w.active===false?'inactive':''}"><span class="worker-avatar">${esc(String(w.name||'?').trim().slice(0,2).toUpperCase())}</span><div class="worker-meta"><b>${esc(w.name)}</b><small>${w.active===false?'Отключён':'Активен'}</small></div><button class="small" onclick="toggleWorker('${esc(w.id)}')">${w.active===false?'Включить':'Отключить'}</button></div>`).join('')||'<p>Сотрудников пока нет.</p>'}<details><summary>${ico('plus')} Добавить сотрудника</summary>${row('Имя',inp('wn'))}${row('Участок',sel('wh',DS.map(d=>[d.id,d.title]),dept))}<button class="primary" onclick="addWorker()">Добавить сотрудника</button></details></div></section><section class="settings-section"><h2>Расценки</h2><p>Изменения применяются к новым начислениям.</p>${DS.map(d=>`<details class="card rate-group"><summary>${ico(d.id)}<span>${esc(d.title)}</span>${ico('chev')}</summary>${state.apps[d.id].operations.map(( og.workers.some(w=>w.name.toLowerCase()===n.toLowerCase()))return alert('Имя уже существует');state.catalog.workers.push({id:uid(),name:n,home:$('wh').value,active:true});persist();settings()}function toggleWorker(id){let w=state.catalog.workers.find(w=>w.id===id);w.active=w.active===false;persist();settings()}function setRate(d,i,v){if(!Number.isFinite(+v)||+v<0)return alert('Проверьте ставку');if(i<0)state.apps[d].hourRate=+v;else state.apps[d].operations[i].rate=+v;persist()}
function areaPerBoard(profile,size){let [t,w,l]=(String(size).match(/\d+/g)||[]).map(Number);if(!(t>0&&w>0&&l>0))return 0;let face=profile==='KM4R'&&String(size).includes('4 стороны')?2*(w+t):['KM2R','KM4R'].includes(profile)?w+2*t:w;return face*l/1e6}

function reference(){let profiles=state.catalog.profiles, rates=DS.flatMap(d=>(state.apps[d.id].operations||[]).map(o=>[String(o.rate),d.title+' · '+o.name+' — '+fmt(o.rate)+' ₽/м²'])), hrs=DS.map(d=>[String(state.apps[d.id].hourRate??350),d.title+' · '+fmt(state.apps[d.id].hourRate??350)+' ₽/ч']);$('screen').innerHTML=`<div class="ref-intro"><div class="eyebrow">ПРОИЗВОДСТВЕННЫЙ СПРАВОЧНИК</div><h1>Справочник</h1><p>Размеры, квадратура и расценки.</p></div><div class="ref-jumps">${[['calc','chart','Калькулятор площади'],['hour','clock','Почасовая работа'],['sizes','book','Профили и размеры'],['rates','money','Расценки']].map(([id,k,t])=>`<button onclick="document.getElementById('ref-${id}').scrollIntoView({block:'start'})">${ico(k)}<span>${t}</span></button>`).join('')}</div><section id="ref-calc" class="ref-block"><h2>Калькулятор площади</h2><div class="card ref-panel">${row('Профиль',sel('rp',Object.keys(profiles)))}${row('Размер',sel('rs',[]))}${row('Количество',inp('rq',100,'number'))}${row('Площадь вручную',inp('rm','','number'))}${row('Работа и ставка',sel('rr',rates))}<div class="ref-results"><div class="metric"><span class="muted">Общая площадь</span><strong id="ra"></strong></div><div class="metric"><span class="muted">Стоимость работы</span><strong id="rpPay"></strong></div></div><p id="ra1" class="ref-single"></p></div></section><section id="ref-hour" class="ref-block"><h2>Почасовая работа</h2><div class="card ref-panel">${row('Часы',inp('rh',2,'number'))}${row('Ставка',sel('rhr',hrs))}<div class="ref-hour-total"><span class="muted">Стоимость работы</span><strong id="rhp"></strong></div></div></section><section id="ref-sizes" class="ref-block"><h2>Профили и размеры</h2><div class="ref-searchbox">${ico('search')}<input class="search ref-search" id="refSearch" placeholder="Поиск профиля или размера"></div><div id="refList"></div><details class="card ref-panel ref-add"><summary>Добавить профиль / размер</summary>${row('Название',inp('pn'))}${row('Размер, мм',inp('ps'))}<button class="primary" onclick="addSize()">Добавить</button></details></section><section id="ref-rates" class="ref-block"><h2>Расценки по участкам</h2>${DS.map(d=>`<div class="card ref-panel ref-rates"><h2 style="margin:10px 0 4px">${esc(d.title)}</h2>${(state.apps[d.id].operations||[]).map(o=>`<div class="row"><label>${esc(o.name)}</label><strong>${fmt(o.rate)} ₽/м²</strong></div>`).join('')}<div class="row"><label>Почасовая работа</label><strong>${fmt(state.apps[d.id].hourRate??350)} ₽/ч</strong></div></div>`).join('')}</section>`;function list(){let q=$('refSearch').value.toLowerCase().trim();$('refList').innerHTML=Object.entries(profiles).map(([p,s])=>{let a=s.filter(x=>(p+' '+x).toLowerCase().includes(q));return a.length?`<details class="ref-group" ${q||p===Object.keys(profiles)[0]?'open':''}><summary><b>${esc(p)}</b><span class="ref-count">${a.length} размеров</span>${ico('chev')}</summary><table class="ref-table"><thead><tr><th>Размер, мм</th><th>Площадь 1 доски</th></tr></thead><tbody>${a.map(x=>`<tr><td dir="ltr"><span class="ref-size">${esc(x.replace(/\s*-\s*4 стороны/,''))}</span>${['KM2R','KM4R'].includes(p)?`<span class="ref-side">${x.includes('4 стороны')?'4 стороны':'3 стороны'}</span>`:''}</td><td>${fmtArea(areaPerBoard(p,x))} м²</td></tr>`).join('')}</tbody></table></details>`:''}).join('')||'<p>Ничего не найдено</p>'}function calculate(){let p=$('rp').value,s=$('rs').value,one=areaPerBoard(p,s),area=$('rm').value!==''?Math.max(0,num($('rm').value)):one*Math.max(0,Math.floor(num($('rq').value)));$('ra').textContent=fmtArea(area)+' м²';$('rpPay').textContent=money(area*num($('rr').value));$('ra1').textContent='Обработка: '+(p==='KM4R'&&s.includes('4 стороны')?'4 стороны':['KM2R','KM4R'].includes(p)?'3 стороны':'1 сторона')+'. Площадь одной доски: '+fmtArea(one)+' м²';$('rhp').textContent=money(Math.max(0,num($('rh').value))*num($('rhr').value))}$('rp').onchange=()=>{$('rs').innerHTML=opts(profiles[$('rp').value]||[]);$('rm').value='';calculate()};$('rs').onchange=()=>{$('rm').value='';calculate()};for(let id of ['rq','rm','rr','rh','rhr']){$(id).oninput=calculate;$(id).onchange=calculate}$('refSearch').oninput=list;$('rp').onchange();list()}
function addSize(){let p=$('pn').value.trim(),s=$('ps').value.trim().replace(/[xх*]/gi,'×').replace(/\s*×\s*/g,'×');if(!p||!/^\d+×\d+×\d+( - 4 стороны)?$/.test(s))return alert('Пример: 20×145×6000');let a=state.catalog.profiles[p]??=[];if(!a.includes(s))a.push(s);persist();reference()}$('theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';document.body.classList.toggle('light',state.theme==='light');persist()};if(!read(KEY,null))persist();render();
