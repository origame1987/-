<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263d63"><title>Классики — 7 класс</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2941;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:#263d63;color:white;padding:20px max(18px,calc((100% - 1080px)/2))}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;color:#d7e5ff}.wrap{max-width:1080px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}button{font:inherit;cursor:pointer;border:1px solid #cad5e8;background:white;border-radius:12px;padding:10px 15px;color:#263d63}[hidden]{display:none!important}button.active,.primary{background:#315bb2;color:white;border-color:#315bb2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e0e6f2;border-radius:18px;padding:20px;box-shadow:0 4px 15px #24395c0b}.card h3{margin:5px 0 10px}.muted{color:#63728b;font-size:14px}.pill{display:inline-block;background:#e9effc;color:#315bb2;padding:5px 9px;border-radius:20px;font-size:12px}h2{margin:0 0 18px}h3{line-height:1.4}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;gap:12px}.done{color:#16794b}select,input{font:inherit;padding:10px;border:1px solid #cad5e8;border-radius:10px;max-width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.lesson{line-height:1.75;font-size:17px;max-width:760px}.lesson p{margin:12px 0}.lesson li{margin:8px 0}.question{background:#f2f6ff;padding:15px;border-radius:14px;margin:15px 0}.answer{display:block;margin:7px 0}.progress{height:9px;background:#e2e8f2;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#3b78d8}.small{font-size:13px}footer{text-align:center;padding:30px;color:#74839b}@media(max-width:600px){.wrap{padding:14px}.card,.panel{padding:16px}header{padding:18px}.lesson{font-size:16px}}
</style></head><body><header><h1>📚 Классики</h1><p>Твой самостоятельный учебник • 7 класс</p></header><main class="wrap"><nav id="nav"></nav><div id="app"></div></main><footer>Классики • прогресс хранится в этом браузере</footer><script>
const SUBJECTS=[
['Алгебра',['Выражения и преобразования','Уравнения с одной переменной','Функции и графики','Степень с натуральным показателем','Одночлены и многочлены','Формулы сокращённого умножения','Разложение на множители','Системы линейных уравнений']],
['Геометрия',['Начальные геометрические сведения','Смежные и вертикальные углы','Треугольники и признаки равенства','Медианы, биссектрисы и высоты','Параллельные прямые','Сумма углов треугольника','Прямоугольные треугольники','Построения циркулем и линейкой']],
['Русский язык',['Повторение изученного','Причастие','Причастный оборот','Деепричастие','Деепричастный оборот','Наречие','Категория состояния','Предлог, союз и частица','Междометие и повторение']],
['Литература',['Предания и былины','Древнерусская литература','Литература XVIII века','Пушкин и Лермонтов','Гоголь и Тургенев','Некрасов и Салтыков-Щедрин','Чехов и русская проза','Литература XX века','Зарубежная литература']],
['История России',['Россия в начале XVI века','Василий III и объединение земель','Иван IV и реформы','Опричнина','Внешняя политика XVI века','Культура и быт XVI века','Смутное время','Первые Романовы','Россия во второй половине XVII века']],
['Всеобщая история',['Великие географические открытия','Возрождение и гуманизм','Реформация в Европе','Абсолютизм и европейские государства','Английская революция','Научная революция','Просвещение','Колонии и международные отношения']],
['Биология',['Многообразие животных','Простейшие и беспозвоночные','Кишечнополостные и черви','Моллюски и членистоногие','Рыбы','Земноводные и пресмыкающиеся','Птицы','Млекопитающие','Экосистемы и охрана природы']],
['География',['Географическая оболочка','Литосфера и рельеф Земли','Атмосфера и климат','Мировой океан','Природные зоны','Население Земли','Африка','Австралия и Океания','Южная Америка','Северная Америка','Евразия']],
['Физика',['Физика и физические методы','Измерения и погрешности','Строение вещества','Механическое движение','Масса и плотность','Сила и законы движения','Давление твёрдых тел','Давление жидкостей и газов','Работа, мощность и энергия']],
['Английский язык',['Family and friends','School life','Daily routines','Past events','Travel and places','Food and health','Future plans','Nature and environment']],
['Информатика',['Информация и её измерение','Компьютер и программное обеспечение','Файлы и папки','Текстовые документы','Графика и мультимедиа','Электронные таблицы','Алгоритмы','Основы программирования','Интернет и безопасность']],
['Обществознание',['Человек и общество','Общение и отношения','Социальные нормы','Права и обязанности','Государство и гражданин','Экономика семьи','Труд и профессии','Культура и духовные ценности']]
];
const KEY='klassiki7-progress-v1';let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let page='home',subject=0,quarter=1,topic=0;const app=document.getElementById('app'),nav=document.getElementById('nav');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ids(s,q){if(s===1){return ({1:[0,1,2,3],2:[4,5],3:[6],4:[7]})[q]||[]}return SUBJECTS[s][1].map((_,i)=>i).filter(i=>Math.floor(i*4/SUBJECTS[s][1].length)+1===q)}
function key(s,i){return s+'-'+i}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}
function count(s){return SUBJECTS[s][1].filter((_,i)=>progress[key(s,i)]).length}
function percent(s){return Math.round(count(s)/SUBJECTS[s][1].length*100)}
function go(p){page=p;render();window.scrollTo(0,0)}
function setSubject(i){subject=i;go('subject')}function setQuarter(i){quarter=i;render()}
function lesson(s,i){subject=s;topic=i;go('lesson')}
function toggle(s,i){progress[key(s,i)]=!progress[key(s,i)];save();render()}
function filterTopics(value){const q=String(value||'').trim().toLocaleLowerCase('ru');let n=0;app.querySelectorAll('.list .item').forEach(b=>{const ok=b.textContent.toLocaleLowerCase('ru').includes(q);b.hidden=!ok;if(ok)n++});let m=document.getElementById('topic-search-empty');if(!m){m=document.createElement('p');m.id='topic-search-empty';m.className='muted';app.querySelector('.list').after(m)}m.textContent=n?'':'Темы по запросу не найдены.'}
function navHtml(){nav.innerHTML=[['home','Предметы'],['subject','Темы'],['reference','Справочник'],['progress','Прогресс']].map(([id,t])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+t+'</button>').join('')}
function render(){navHtml();if(page==='home'){app.innerHTML='<h2>Выбери предмет</h2><div class="grid">'+SUBJECTS.map(([name,topics],i)=>name==='Обществознание'?'':'<article class="card"><span class="pill">'+topics.length+' тем</span><h3>'+esc(name)+'</h3><p class="muted">Пройдено: '+count(i)+' из '+topics.length+'</p><div class="progress"><span style="width:'+percent(i)+'%"></span></div><p><button class="primary" onclick="setSubject('+i+')">Открыть предмет</button></p></article>').join('')+'</div>';return}
if(page==='subject'){let topics=SUBJECTS[subject][1];app.innerHTML='<h2>'+esc(SUBJECTS[subject][0])+'</h2><div class="toolbar">'+[1,2,3,4].map(q=>'<button class="'+(quarter===q?'active':'')+'" onclick="setQuarter('+q+')">'+q+' четверть</button>').join('')+'</div><div class="panel"><h3>Темы четверти</h3><p><input type="search" id="topic-search" aria-label="Поиск по темам четверти" placeholder="Найти тему…" oninput="filterTopics(this.value)" style="width:100%;max-width:420px"></p><p class="muted">Распределение предварительное: порядок уточняется по школьной программе.</p><div class="list">'+ids(subject,quarter).map(i=>'<button class="item" onclick="lesson('+subject+','+i+')"><span>'+(i+1)+'. '+esc(topics[i])+'</span><span class="'+(progress[key(subject,i)]?'done':'muted')+'">'+(progress[key(subject,i)]?'✓ Пройдено':'Изучить →')+'</span></button>').join('')+'</div></div>';return}
if(page==='lesson'){let name=SUBJECTS[subject][1][topic];app.innerHTML='<div class="panel lesson"><button onclick="go(\'subject\')">← К темам</button><p class="pill">'+esc(SUBJECTS[subject][0])+' • Оглавление</p><h2>'+esc(name)+'</h2><p><strong>Материал пока не опубликован.</strong> Это пункт оглавления, а не готовый урок.</p><p class="muted">Новые отметки о прохождении пустой темы недоступны. Ранее сохранённый прогресс не изменяется.</p></div>';return}
if(page==='reference'){app.innerHTML='<h2>Справочник 7 класса</h2><div class="toolbar"><input id="search" placeholder="Поиск по справочнику…" oninput="filterRef(this.value)"></div><div id="ref-list"></div>';filterRef('');return}
if(page==='progress'){let total=SUBJECTS.reduce((a,s)=>a+(s[0]==='Обществознание'?0:s[1].length),0),done=SUBJECTS.reduce((a,s,i)=>a+(s[0]==='Обществознание'?0:count(i)),0);app.innerHTML='<h2>Мой прогресс</h2><div class="panel"><h3>'+done+' из '+total+' тем</h3><div class="progress"><span style="width:'+Math.round(done/total*100)+'%"></span></div><p class="muted">Сохранено только в этом браузере. Для переноса используй экспорт и импорт.</p><button onclick="exportData()">Экспорт прогресса</button> <button onclick="document.getElementById(\'import\').click()">Импорт прогресса</button><input hidden id="import" type="file" accept=".json,application/json" onchange="importData(this)"></div><div class="grid" style="margin-top:15px">'+SUBJECTS.map(([n],i)=>n==='Обществознание'?'':'<div class="card"><b>'+esc(n)+'</b><p>'+percent(i)+'%</p><div class="progress"><span style="width:'+percent(i)+'%"></span></div></div>').join('')+'</div>';return}}
const REF=[
['Алгебра','Линейное уравнение','Уравнение ax + b = 0 при a ≠ 0 имеет решение x = −b/a. Проверка: подставь найденное число в исходное уравнение.'],
['Алгебра','Свойства степеней','aᵐ · aⁿ = aᵐ⁺ⁿ; aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0); (aᵐ)ⁿ = aᵐⁿ.'],
['Алгебра','Формулы сокращённого умножения','(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b².'],
['Геометрия','Сумма углов треугольника','Сумма внутренних углов любого треугольника равна 180°. Внешний угол равен сумме двух внутренних углов, не смежных с ним.'],
['Геометрия','Вертикальные углы','Вертикальные углы равны. Смежные углы в сумме дают 180°.'],
['Физика','Скорость','v = s/t; путь s = vt; время t = s/v. В СИ скорость измеряется в м/с.'],
['Физика','Плотность','ρ = m/V. Масса m = ρV. Единица СИ: кг/м³.'],
['Физика','Давление','p = F/S. Единица давления — паскаль (Па), 1 Па = 1 Н/м².'],
['Русский язык','Причастие','Причастие обозначает признак предмета по действию и отвечает на вопросы какой? какая? какое? какие?'],
['Русский язык','Деепричастие','Деепричастие обозначает добавочное действие при основном действии глагола. Деепричастный оборот обычно выделяется запятыми.'],
['История России','Хронология XVI–XVII веков','1547 — венчание Ивана IV на царство; 1565 — начало опричнины; 1613 — избрание Михаила Романова; 1649 — Соборное уложение.'],
['География','Масштаб карты','Масштаб 1:100 000 означает, что 1 см на карте соответствует 1 км на местности.'],
['Английский язык','Past Simple','Для правильных глаголов обычно добавляется -ed; для неправильных используется вторая форма. В вопросах и отрицаниях применяется did + начальная форма глагола.'],
['Информатика','Единицы информации','1 байт = 8 бит; 1 КиБ = 1024 байта; 1 МиБ = 1024 КиБ.']
];
function filterRef(q){let a=REF.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('ref-list').innerHTML='<div class="grid">'+a.map(x=>'<article class="card"><span class="pill">'+esc(x[0])+'</span><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></article>').join('')+'</div>'+(a.length?'':'<p>Ничего не найдено.</p>')}
function exportData(){let blob=new Blob([JSON.stringify({version:2,progress,geometryQuarter:JSON.parse(localStorage.getItem('geometry7-q1-v1')||'{}'),geometryAssessments:JSON.parse(localStorage.getItem('geometry7-q1-assessments-v1')||'{}')},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='klassiki-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validatedProgress(source){
if(!source||typeof source!=='object'||Array.isArray(source))throw Error('Invalid progress');
const result={};
for(const [k,v] of Object.entries(source)){
if(k==='mistakes-v1'&&Array.isArray(v)){result[k]=v.filter(e=>e&&typeof e==='object'&&!Array.isArray(e)&&/^\\d+-\\d+$/.test(String(e.id||''))&&Number.isInteger(e.question)&&e.question>=0&&e.question<100&&['prompt','chosen','answer','explanation','date'].every(f=>typeof e[f]==='string'&&e[f].length<=3000)).slice(0,150);continue}
if(/^\d+-\d+$/.test(k)&&typeof v==='boolean')result[k]=v;
else if(/^quiz-\d+-\d+$/.test(k)&&v&&typeof v==='object'&&Number.isInteger(v.correct)&&Number.isInteger(v.total)&&v.total>0&&v.total<=1000&&v.correct>=0&&v.correct<=v.total&&typeof v.date==='string'&&!Number.isNaN(Date.parse(v.date)))result[k]={correct:v.correct,total:v.total,date:v.date};
}
return result;
}
async function importData(input){let f=input.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let restored=validatedProgress(data.progress);progress={...progress,...restored};save();for(const [field,storage] of [['geometryQuarter','geometry7-q1-v1'],['geometryAssessments','geometry7-q1-assessments-v1']]){const incoming=data[field];if(incoming&&typeof incoming==='object'&&!Array.isArray(incoming)){const clean={};for(const [k,v] of Object.entries(incoming)){if(!/^(?:[0-9]|1[0-5])$/.test(k)||!v||typeof v!=='object'||Array.isArray(v))continue;if(field==='geometryQuarter'){const attempts=Array.isArray(v.attempts)?v.attempts.filter(a=>a&&typeof a==='object'&&typeof a.correct==='boolean'&&Number.isInteger(a.chosen)&&a.chosen>=0&&a.chosen<3&&typeof a.date==='string').slice(-20):[];clean[k]={done:v.done===true,attempts}}else if(Array.isArray(v.scores)&&v.scores.length===10&&v.scores.every(n=>Number.isInteger(n)&&n>=0&&n<=4)){clean[k]={scores:v.scores,total:v.scores.reduce((a,b)=>a+b,0),max:Number.isInteger(v.max)?v.max:40,date:typeof v.date==='string'?v.date:''}}}const oldState=JSON.parse(localStorage.getItem(storage)||'{}');localStorage.setItem(storage,JSON.stringify({...clean,...oldState}))}}render();alert('Прогресс и результаты тестов восстановлены. Существующие записи сохранены.')}catch{alert('Не удалось прочитать файл прогресса')}finally{input.value=''}}
render();
