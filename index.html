<!doctype html>
<html lang="ru">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=6">
  <link rel="icon" type="image/png" href="./icon-180.png?v=6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KRASKI DOSKI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>KRASKI DOSKI — Главное меню</title>
  <style>
    :root{
      --bg:#07080c;
      --panel:#0c0d14;
      --card:#262830;
      --card2:#2b2d36;
      --text:#ffffff;
      --muted:#aeb0bc;
      --red:#f0171f;
      --line:rgba(255,255,255,.05);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color-scheme: dark;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:radial-gradient(circle at top,#11131d 0,#08090d 34%,#050609 100%);color:var(--text)}
    body{padding:18px 14px 24px;min-height:100vh}
    main{max-width:820px;margin:0 auto}
    .shell{
      background:linear-gradient(180deg,rgba(13,14,21,.96),rgba(8,9,15,.98));
      border-radius:34px;
      padding:22px 18px 18px;
      box-shadow:0 18px 50px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.03);
    }
    .brand{display:flex;gap:18px;align-items:center;margin-bottom:20px}
    .logo{
      flex:0 0 80px;height:80px;border-radius:22px;
      background:linear-gradient(180deg,#ff2828 0,#d90f17 100%);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 12px 24px rgba(217,15,23,.25), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .logo svg{width:44px;height:44px;display:block}
    .brand h1{margin:0;font-size:29px;line-height:1.02;letter-spacing:.02em;font-weight:800}
    .brand p{margin:8px 0 0;font-size:20px;line-height:1.2;color:var(--muted);font-weight:500}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{
      background:linear-gradient(180deg,var(--card2),var(--card));
      border-radius:28px;
      min-height:180px;
      padding:24px 18px 20px;
      color:var(--text);
      text-decoration:none;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      border:1px solid var(--line);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
      transition:transform .15s ease,border-color .15s ease, background .15s ease;
    }
    .card:active{transform:scale(.985)}
    .card:hover{border-color:rgba(240,23,31,.38)}
    .card .icon{margin-bottom:18px;color:#fff;opacity:.95}
    .card .icon svg{width:42px;height:42px;stroke-width:1.9}
    .card strong{font-size:27px;line-height:1.07;font-weight:700;letter-spacing:.01em}
    .card small{margin-top:10px;font-size:14px;line-height:1.35;color:var(--muted);max-width:220px}
    .wide{grid-column:1/-1;min-height:130px;flex-direction:row;justify-content:flex-start;text-align:left;padding:20px 22px;gap:18px}
    .wide .icon{margin:0}
    .wide .txt{display:flex;flex-direction:column}
    .wide strong{font-size:26px}
    .wide small{max-width:none}
    .hint{
      margin-top:16px;
      background:rgba(255,255,255,.035);
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px 16px;
      color:#bfc2cd;
      font-size:13px;
      line-height:1.5;
    }
    .hint b{color:#fff}
    @media (max-width:640px){
      .brand{gap:14px;align-items:flex-start}
      .logo{width:78px;height:78px;border-radius:21px}
      .brand h1{font-size:26px}
      .brand p{font-size:18px}
      .grid{gap:14px}
      .card{min-height:162px;border-radius:24px}
      .card strong{font-size:24px}
      .wide{min-height:110px}
    }
    @media (max-width:460px){
      body{padding:14px 10px 18px}
      .shell{padding:18px 14px 14px;border-radius:28px}
      .logo{width:72px;height:72px;border-radius:20px}
      .logo svg{width:40px;height:40px}
      .brand h1{font-size:22px}
      .brand p{font-size:16px}
      .card{min-height:146px;padding:20px 12px 16px;border-radius:22px}
      .card strong{font-size:21px}
      .card small{font-size:12px}
      .card .icon svg{width:36px;height:36px}
      .wide{padding:18px 16px;gap:14px}
      .wide strong{font-size:22px}
      .wide small{font-size:12px}
    }

    /* Компактное меню: строгие прямоугольные карточки и спокойная типографика */
    body{padding:14px 12px 22px}
    main{max-width:760px}
    .shell{border-radius:22px;padding:18px 16px 16px;box-shadow:0 14px 36px rgba(0,0,0,.24)}
    .brand{gap:12px;margin-bottom:18px;align-items:center}
    .logo{flex-basis:56px;width:56px;height:56px;border-radius:13px;box-shadow:none}
    .logo svg{width:30px;height:30px}
    .brand h1{font-size:21px;font-weight:700;letter-spacing:.015em;line-height:1.2}
    .brand p{font-size:13px;margin:4px 0 0;font-weight:400;line-height:1.35}
    .grid{gap:10px}
    .card{min-height:116px;padding:15px 11px 13px;border-radius:12px;background:#23252d;box-shadow:none}
    .card .icon{margin-bottom:9px;opacity:.9}
    .card .icon svg{width:27px;height:27px;stroke-width:1.7}
    .card strong{font-size:16px;font-weight:600;line-height:1.22;letter-spacing:0}
    .card small{font-size:10px;margin-top:6px;line-height:1.35}
    .wide{min-height:76px;padding:14px 16px;gap:13px;border-radius:12px}
    .wide .icon svg{width:28px;height:28px}
    .wide strong{font-size:17px}
    .wide small{font-size:11px;margin-top:4px}
    .hint{border-radius:12px;margin-top:12px;padding:12px 13px;font-size:11px;line-height:1.45}
    @media(max-width:640px){
      .brand{gap:12px;align-items:center}
      .logo{width:56px;height:56px;flex-basis:56px;border-radius:13px}
      .brand h1{font-size:20px}
      .brand p{font-size:12px}
      .grid{gap:10px}
      .card{min-height:113px;border-radius:12px}
      .card strong{font-size:16px}
      .wide{min-height:74px}
    }
    @media(max-width:460px){
      body{padding:12px 9px 18px}
      .shell{padding:14px 12px;border-radius:19px}
      .brand{gap:11px;margin-bottom:14px}
      .logo{width:52px;height:52px;flex-basis:52px;border-radius:12px}
      .logo svg{width:28px;height:28px}
      .brand h1{font-size:19px}
      .brand p{font-size:12px}
      .grid{gap:9px}
      .card{min-height:101px;padding:13px 8px 11px;border-radius:11px}
      .card strong{font-size:15px}
      .card small{font-size:9.5px;margin-top:5px}
      .card .icon{margin-bottom:8px}
      .card .icon svg{width:26px;height:26px}
      .wide{min-height:64px;padding:12px 14px;gap:12px}
      .wide strong{font-size:16px}
      .wide small{font-size:10px}
      .hint{margin-top:10px;padding:11px 12px;font-size:10px}
    }
  
/* Фирменный логотип KRASKI DOSKI */
.brand-icon.brand-logo,.mark.logo-mark,.logo.logo-mark{background:transparent!important;padding:0!important;box-shadow:none!important;overflow:hidden!important;border-radius:12px!important;}
.brand-icon.brand-logo img,.mark.logo-mark img,.logo.logo-mark img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit;}
</style>
</head>
<body>
  <main>
    <section class="shell">
      <div class="brand">
        <div class="logo logo-mark"><img src="./logo-kraski-doski.png" alt="KRASKI DOSKI"></div>
        <div>
          <h1>KRASKI DOSKI</h1>
          <p>Главное меню приложения</p>
        </div>
      </div>

      <div class="grid">
        <a class="card" href="./remont.html?v=20261119-6">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L9 18l-4 1 1-4 8.7-8.7Z"/>
              <path d="m13.5 7.5 3 3"/>
            </svg>
          </div>
          <strong>Ремонт</strong>
        </a>

        <a class="card" href="./zagotovka.html?v=20261119-6">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="5" width="16" height="5" rx="1.5"/>
              <rect x="4" y="14" width="16" height="5" rx="1.5"/>
            </svg>
          </div>
          <strong>Заготовка</strong>

        <a class="card" href="./sortirovka.html?v=20261119-6">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7h10"/>
              <path d="M3 12h14"/>
              <path d="M3 17h18"/>
              <path d="m17 5 4 4-4 4"/>
            </svg>
          </div>
          <strong>Сборка‑<br>сортировка</strong>
        </a>

        <a class="card" href="./stanok.html?v=20261119-6">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="10" rx="2"/>
              <path d="M7 16v3M17 16v3M8 10h.01M12 10h4"/>
            </svg>
          </div>
          <strong>Станок</strong>
        </a>

        <a class="card wide" href="./spravochnik.html?v=20261119-6">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.2V6.4c0-.56.44-1.01.99-1.04 1.84-.11 3.63.16 5.16 1.17 1.2.8 1.85 1.6 1.85 1.6s.65-.8 1.85-1.6c1.53-1.01 3.32-1.28 5.16-1.17.55.03.99.48.99 1.04v12.8c0 .55-.45 1-1 1-.79 0-2.6-.15-4.48.58-1.28.5-2.3 1.39-2.82 1.88-.52-.49-1.54-1.38-2.82-1.88-1.88-.73-3.69-.58-4.48-.58-.55 0-1-.45-1-1Z"/>
              <path d="M12 8.2v12"/>
            </svg>
          </div>
          <div class="txt">
            <strong>Справочник</strong>
          </div>
        </a>
      </div>

      <div class="hint"><b>Подсказка:</b> сотрудники, размеры и часть настроек используются внутри приложений. Если работаешь без общей базы, данные на разных телефонах между собой не синхронизируются.</div>
    </section>
  </main>
</body>
</html>
