/summary>${row('Название',inp('pn'))}${row('Размер, мм',inp('ps'))}${row('Обработка',sel('psides',[['auto','По профилю'],['1','1 сторона'],['3','3 стороны'],['4','4 стороны']],'auto'),'layers')}<button class="primary" onclick="addSize()">Добавить</button></details></section><section id="ref-rates" class="ref-block"><h2>Расценки по участкам</h2>${DS.map(d=>`<div class="card ref-panel ref-rates"><h2 style="margin:10px 0 4px">${esc(d.title)}</h2>${(state.apps[d.id].operations||[]).map(o=>`<div class="row"><label>${esc(o.name)}</label><strong>${fmt(o.rate)} ₽/м²</strong></div>`).join('')}<div class="row"><label>Почасовая работа</label><strong>${fmt(state.apps[d.id].hourRate??350)} ₽/ч</strong></div></div>`).join('')}</section>`;function list(){let q=$('refSearch').value.toLowerCase().trim();$('refList').innerHTML=Object.entries(profiles).map(([p,s])=>{let a=s.filter(x=>(p+' '+x).toLowerCase().includes(q));return a.length?`<details class="ref-group" ${q||p===Object.keys(profiles)[0]?'open':''}><summary><b>${esc(p)}</b><span class="ref-count">${a.length} размеров</span>${ico('chev')}</summary><div class="ref-edit-tools"><button type="button" data-ref-action="rename" data-profile="${esc(p)}">${ico('pencil')} Переименовать</button><button type="button" data-ref-action="add" data-profile="${esc(p)}">${ico('plus')} Размер</button><button type="button" class="ref-danger" data-ref-action="delete-profile" data-profile="${esc(p)}" aria-label="Удалить профиль">${ico('trash')}</button></div><table class="ref-table ref-edit-table"><thead><tr><th>Размер, мм</th><th>Площадь</th><th aria-label="Действия"></th></tr></thead><tbody>${a.map(x=>`<tr><td dir="ltr"><span class="ref-size">${esc(x.replace(/\s*-\s*[134]\s*сторон[аы]?$/i,''))}</span>${`<span class="ref-side">${profileSides(p,x)===1?'1 сторона':profileSides(p,x)+' стороны'}</span>`}</td><td>${fmtArea(areaPerBoard(p,x))} м²</td><td><div class="ref-size-actions"><button type="button" data-ref-action="edit" data-profile="${esc(p)}" data-size="${esc(x)}" aria-label="Редактировать размер">${ico('pencil')}</button><button type="button" class="ref-danger" data-ref-action="delete-size" data-profile="${esc(p)}" data-size="${esc(x)}" aria-label="Удалить размер">${ico('trash')}</button></div></td></tr>`).join('')}</tbody></table></details>`:''}).join('')||'<p>Ничего не найдено</p>'}function calculate(){let p=$('rp').value,s=$('rs').value,one=areaPerBoard(p,s),area=$('rm').value!==''?Math.max(0,num($('rm').value)):one*Math.max(0,Math.floor(num($('rq').value))-Math.max(0,Math.floor(num($('rb').value))));$('ra').textContent=fmtArea(area)+' м²';$('rpPay').textContent=money(area*num($('rr').value));$('ra1').textContent='Обработка: '+(profileSides(p,s)===1?'1 сторона':profileSides(p,s)+' стороны')+'. Площадь одной доски: '+fmtArea(one)+' м²';$('rhp').textContent=money(Math.max(0,num($('rh').value))*num($('rhr').value))}$('rp').onchange=()=>{$('rs').innerHTML=opts(profiles[$('rp').value]||[]);$('rm').value='';calculate()};$('rs').onchange=()=>{$('rm').value='';calculate()};for(let id of ['rq','rb','rm','rr','rh','rhr']){$(id).oninput=calculate;$(id).onchange=calculate}$('refSearch').oninput=list;$('refList').onclick=e=>{const b=e.target.closest('[data-ref-action]');if(!b)return;const {refAction,profile,size}=b.dataset;catalogAction(refAction,profile,size)};$('rp').onchange();list()}
Object.assign(paths,{pencil:'<path d="m15 5 4 4M3 21l5-1 13-13-4-4L4 16z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>'});
function catalogRefresh(profile){reference();const input=$('refSearch');if(profile&&input){input.value=profile;input.dispatchEvent(new Event('input'));const group=$('refList').querySelector('details');if(group)group.open=true}document.getElementById('ref-sizes')?.scrollIntoView({block:'start'})}
function catalogCommit(profiles,profile){if(!persist({...state,catalog:{...state.catalog,profiles}}))return false;catalogRefresh(profile);return true}
function catalogSizeText(raw,sides){let v=String(raw).trim().replace(/[xх*]/gi,'×').replace(/\s*×\s*/g,'×').replace(/\s*-\s*[134]\s*сторон[аы]?$/i,'');if(!/^\d+×\d+×\d+$/.test(v)||!v.split('×').every(n=>Number.isSafeInteger(+n)&&+n>0))return '';return sides==='auto'?v:v+' - '+sides+(sides==='1'?' сторона':' стороны')}
function catalogAction(action,p,size){const old=state.catalog.profiles;if(!Object.hasOwn(old,p))return;const sizes=old[p],m=$('modal');
if(action==='delete-profile'||action==='delete-size'){if(action==='delete-profile'&&Object.keys(old).length<=1)return alert('Оставьте хотя бы один профиль.');if(action==='delete-size'&&sizes.length<=1)return alert('Это последний размер профиля. Удалите профиль целиком или добавьте другой размер.');if(!confirm(action==='delete-profile'?'Удалить профиль «'+p+'» со всеми размерами? Старые записи останутся.':'Удалить размер '+size+'? Старые записи останутся.'))return;let next={...old};if(action==='delete-profile')delete next[p];else next[p]=sizes.filter(x=>x!==size);catalogCommit(next,action==='delete-profile'?'':p);return}
const rename=action==='rename',adding=action==='add';if(!rename&&!adding&&(!size||!sizes.includes(size)))return;
m.innerHTML='<h2 class="ref-modal-title">'+(rename?'Переименовать профиль':adding?'Добавить размер':'Редактировать размер')+'</h2><p>'+esc(p)+'</p>'+(rename?row('Название',inp('editCatalogName',p),'layers'):row('Размер, мм',inp('editCatalogSize',adding?'':size.replace(/\s*-\s*[134]\s*сторон[аы]?$/i,'')),'ruler')+row('Обработка',sel('editCatalogSides',[['1','1 сторона'],['3','3 стороны'],['4','4 стороны']],String(profileSides(p,adding?'':size))),'layers'))+'<p>Изменения действуют для новых записей. История сохранится.</p><button class="primary" id="catalogSave">Сохранить</button><button type="button" id="catalogCancel">Отмена</button>';
$('catalogCancel').onclick=()=>m.close();$('catalogSave').onclick=()=>{let next={...state.catalog.profiles},newName=p;if(rename){newName=$('editCatalogName').value.trim();if(!newName)return alert('Укажите название');if(newName!==p&&Object.hasOwn(next,newName))return alert('Такой профиль уже существует');if(newName!==p){const preserved=next[p].map(x=>{let n=String(profileSides(p,x));return profileSides(newName,x)===+n?x:catalogSizeText(x,n)});next=Object.fromEntries(Object.entries(next).map(([k,v])=>k===p?[newName,preserved]:[k,v]))}}else{const text=catalogSizeText($('editCatalogSize').value,$('editCatalogSides').value);if(!text||!(areaPerBoard(p,text)>0)||!Number.isFinite(areaPerBoard(p,text)))return alert('Введите три положительных размера, например 20×145×6000');const equivalent=x=>x.replace(/\s*-\s*[134]\s*сторон[аы]?$/i,'')===text.replace(/\s*-\s*[134]\s*сторон[аы]?$/i,'')&&profileSides(p,x)===profileSides(p,text);if(next[p].some(x=>(adding||x!==size)&&equivalent(x)))return alert('Такой размер с выбранной обработкой уже существует');next[p]=adding?[...next[p],text]:next[p].map(x=>x===size?text:x)}if(catalogCommit(next,newName))m.close()};m.showModal()}
function addSize(){let p=$('pn').value.trim(),s=$('ps').value.trim().replace(/[xх*]/gi,'×').replace(/\s*×\s*/g,'×');let choice=$('psides').value;if(choice!=='auto')s=s.replace(/\s*-\s*[134]\s*сторон[аы]?$/i,'')+' - '+choice+(choice==='1'?' сторона':' стороны');if(!p||!/^\d+×\d+×\d+( - (1 сторона|3 стороны|4 стороны))?$/.test(s)||!(areaPerBoard(p,s)>0)||!Number.isFinite(areaPerBoard(p,s)))return alert('Пример: 20×145×6000. Выберите количество сторон.');const profiles=state.catalog.profiles;
const sizes=Object.hasOwn(profiles,p)?profiles[p]:[];
if(sizes.includes(s))return;
if(persist({...state,catalog:{...state.catalog,profiles:{...profiles,[p]:[...sizes,s]}}}))reference()}$('theme').onclick=()=>setDesignTheme(state.theme==='light'?'dark':'light');if(!read(KEY,null))persist();render();
</script></body></html>
